<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2e4a62">
    <title>Tide Predictions</title>
    <link rel="icon" href="favicon.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>    
    <h1>
        Tides for Stoshsylvania
        <button type="button" id="refresh-btn" aria-label="Refresh tide data">🔄</button>
    </h1>
    <div class="container">
        <div id="next-tide" class="section">
            <h2 id="next-tide-heading">Next Tide</h2>
            <div id="next-tide-info"></div>
        </div>
        <div id="moon-phase" class="section">
            <h2>🌙 Moon Phase</h2>
            <div id="moon-phase-info"></div>
        </div>
        <div id="future-tides" class="section">
            <h2>⏭ Upcoming Tides</h2>
            <div id="future-tides-list" class="tides"></div>
        </div>
        <div id="previous-tides" class="section">
            <h2>⏮ Past Tides</h2>
            <div id="previous-tides-list" class="tides"></div>
        </div>
    </div>
    <script src="src/app.js"></script>
</body>
</html>
